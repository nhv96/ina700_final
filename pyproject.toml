[project]
name = "project2"
version = "0.1.0"
description = "Detect shapes on an A3 sheet with a Basler camera and YOLO, and send them to an ABB robot"
readme = "README.md"
requires-python = ">=3.12"
# Only the packages the code imports directly. Everything else (matplotlib,
# pillow, pyyaml, ...) is pulled in by ultralytics and pinned in uv.lock.
dependencies = [
    "numpy",
    "opencv-python",
    "pypylon",
    "torch",
    "torchvision",
    "ultralytics",
]

# On Linux (including the Raspberry Pi) take the CPU-only PyTorch build.
# The default build drags in ~4 GB of NVIDIA CUDA libraries that the Pi cannot use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
